[workspace]
resolver = "2"
members = [
    "crates/rbitcoin-primitives",
    "crates/rbitcoin-log",
    "crates/rbitcoin-store",
    "crates/rbitcoin-query",
    "crates/rbitcoin-consensus",
    "crates/rbitcoin-mempool",
    "crates/rbitcoin-net",
    "crates/rbitcoin-rpc",
    "crates/rbitcoin-electrum",
    "crates/rbitcoin-esplora",
    "crates/rbitcoin-cli",
    "crates/rbitcoin-node",
    "crates/rbitcoin-test",
    "crates/rbitcoin-bench",
]
default-members = ["crates/rbitcoin-node"]

[workspace.package]
version = "0.7.99"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reardencode/rbitcoin"
# Matches CI + nixpkgs/crane pin (rustc 1.95). Not a lower “aspirational” MSRV.
rust-version = "1.95"

[workspace.dependencies]
rbitcoin-primitives = { path = "crates/rbitcoin-primitives" }
rbitcoin-log = { path = "crates/rbitcoin-log" }
rbitcoin-store = { path = "crates/rbitcoin-store" }
rbitcoin-query = { path = "crates/rbitcoin-query" }
rbitcoin-consensus = { path = "crates/rbitcoin-consensus" }
rbitcoin-mempool = { path = "crates/rbitcoin-mempool" }
rbitcoin-net = { path = "crates/rbitcoin-net" }
rbitcoin-rpc = { path = "crates/rbitcoin-rpc" }
rbitcoin-electrum = { path = "crates/rbitcoin-electrum" }
rbitcoin-esplora = { path = "crates/rbitcoin-esplora" }
rbitcoin-cli = { path = "crates/rbitcoin-cli" }
rbitcoin-node = { path = "crates/rbitcoin-node" }
rbitcoin-test = { path = "crates/rbitcoin-test" }
rbitcoin-bench = { path = "crates/rbitcoin-bench" }

# JSON for Electrum (and tests). No other serde derives in core crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Esplora REST + wallet WebSocket live updates.
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
# rust-bitcoin stack
# No `bitcoinconsensus` feature — we verify scripts in pure Rust (see rbitcoin-consensus::script).
bitcoin = { version = "0.32.102", default-features = true }
bitcoin_hashes = "0.14.101"
miniscript = { version = "12.3.7", default-features = false, features = ["std"] }
# BIP324 v2 encrypted P2P transport (tokio async ProtocolReader/Writer).
bip324 = { version = "0.11", default-features = true, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "rt", "signal", "fs"] }
# Lock-free Arc publish for immutable pin outs/layout halves
arc-swap = "1"
# Process-wide heap for product binaries (musl static + glibc). Replaces the
# platform default (musl/glibc malloc) via #[global_allocator] in each bin.
mimalloc = "0.1"

# Fail the build on rustc warnings (unused imports, dead code, …).
[workspace.lints.rust]
warnings = "deny"
# cargo-llvm-cov sets `cfg(coverage)` so diagnostic microbenches can use
# `#[cfg(not(coverage))]` and stay out of the first-party LCOV denominator.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)'] }

# Clippy: CI is `clippy --workspace --all-targets -- -D warnings`.
# No workspace allow list. A leftover lint is `#[allow(clippy::…)]` on
# the item with a reason (`docs/code-shape.md`).
# Nursery opt-in: Core-faithful loops fail CI unless site-allowed.
[workspace.lints.clippy]
cognitive_complexity = "warn"

# Bitcoin Knots v2 header (BLAKE2b chains): bitcoin-blake/rust-bitcoin branch
# `v2-header` on `bitcoin-0.32.102`. The sibling crates come from the same
# tree so one `BlockHash` type flows through the workspace.
[patch.crates-io]
bitcoin = { git = "https://github.com/bitcoin-blake/rust-bitcoin", rev = "1ed5dbeda6c509638672c3f5a6877ac114f4f65f" }
bitcoin_hashes = { git = "https://github.com/bitcoin-blake/rust-bitcoin", rev = "1ed5dbeda6c509638672c3f5a6877ac114f4f65f" }
bitcoin-io = { git = "https://github.com/bitcoin-blake/rust-bitcoin", rev = "1ed5dbeda6c509638672c3f5a6877ac114f4f65f" }
bitcoin-units = { git = "https://github.com/bitcoin-blake/rust-bitcoin", rev = "1ed5dbeda6c509638672c3f5a6877ac114f4f65f" }
base58ck = { git = "https://github.com/bitcoin-blake/rust-bitcoin", rev = "1ed5dbeda6c509638672c3f5a6877ac114f4f65f" }
